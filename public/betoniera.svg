<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a6580"/>
      <stop offset="100%" stop-color="#1a2535"/>
    </linearGradient>
    <linearGradient id="truck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8d8e8"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f0e8"/>
      <stop offset="100%" stop-color="#a8c8b0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- === TRUCK BODY (cab) === -->
  <!-- Main chassis/frame -->
  <rect x="60" y="280" width="400" height="100" rx="12" fill="#d0dce8"/>
  <!-- Cab -->
  <rect x="60" y="210" width="145" height="120" rx="18" fill="url(#truck)"/>
  <!-- Cab windshield -->
  <rect x="75" y="222" width="110" height="70" rx="10" fill="#7db8d8" opacity="0.85"/>
  <!-- Cab windshield glare -->
  <rect x="80" y="227" width="40" height="25" rx="6" fill="white" opacity="0.4"/>
  <!-- Cab door line -->
  <line x1="155" y1="225" x2="155" y2="325" stroke="#b0c0d0" stroke-width="3"/>
  <!-- Door handle -->
  <rect x="160" y="272" width="18" height="6" rx="3" fill="#90a8bc"/>
  <!-- Exhaust pipe -->
  <rect x="185" y="195" width="14" height="55" rx="7" fill="#b0c0d0"/>
  <ellipse cx="192" cy="194" rx="9" ry="5" fill="#8898a8"/>

  <!-- === DRUM MIXER === -->
  <!-- Drum support frame -->
  <rect x="255" y="230" width="22" height="80" rx="8" fill="#8898a8"/>
  <!-- Drum body (tilted ellipse shape) -->
  <ellipse cx="330" cy="220" rx="130" ry="68" fill="url(#drum)" transform="rotate(-18 330 220)"/>
  <!-- Drum stripes -->
  <rect x="260" y="155" width="16" height="140" rx="4" fill="#6aaa78" opacity="0.7" transform="rotate(-18 268 225)"/>
  <rect x="300" y="148" width="16" height="145" rx="4" fill="#6aaa78" opacity="0.7" transform="rotate(-18 308 220)"/>
  <rect x="340" y="145" width="12" height="140" rx="4" fill="white" opacity="0.3" transform="rotate(-18 346 215)"/>
  <!-- Drum rear cap -->
  <ellipse cx="218" cy="233" rx="38" ry="52" fill="#8ab8a0" transform="rotate(-18 218 233)"/>
  <!-- Drum mouth (opening) -->
  <ellipse cx="432" cy="198" rx="38" ry="52" fill="#1a2535" transform="rotate(-18 432 198)"/>
  <ellipse cx="432" cy="198" rx="38" ry="52" fill="none" stroke="#c8dce8" stroke-width="8" transform="rotate(-18 432 198)"/>
  <!-- Drum highlight -->
  <ellipse cx="300" cy="175" rx="55" ry="16" fill="white" opacity="0.25" transform="rotate(-18 300 175)"/>

  <!-- === REAR LADDER === -->
  <rect x="440" y="230" width="12" height="110" rx="4" fill="#8898a8"/>
  <rect x="460" y="230" width="12" height="110" rx="4" fill="#8898a8"/>
  <rect x="440" y="255" width="32" height="7" rx="3" fill="#8898a8"/>
  <rect x="440" y="280" width="32" height="7" rx="3" fill="#8898a8"/>
  <rect x="440" y="305" width="32" height="7" rx="3" fill="#8898a8"/>

  <!-- === WHEELS === -->
  <!-- Front wheel -->
  <circle cx="148" cy="390" r="46" fill="#2a3540"/>
  <circle cx="148" cy="390" r="30" fill="#3a4a58"/>
  <circle cx="148" cy="390" r="16" fill="#8898a8"/>
  <circle cx="148" cy="390" r="7" fill="#c0d0dc"/>
  <!-- Rear wheel (double) -->
  <circle cx="355" cy="390" r="46" fill="#2a3540"/>
  <circle cx="355" cy="390" r="30" fill="#3a4a58"/>
  <circle cx="355" cy="390" r="16" fill="#8898a8"/>
  <circle cx="355" cy="390" r="7" fill="#c0d0dc"/>
  <circle cx="410" cy="390" r="40" fill="#2a3540"/>
  <circle cx="410" cy="390" r="26" fill="#3a4a58"/>
  <circle cx="410" cy="390" r="14" fill="#8898a8"/>
  <circle cx="410" cy="390" r="6" fill="#c0d0dc"/>

  <!-- Headlight -->
  <rect x="54" y="270" width="18" height="26" rx="6" fill="#ffe88a"/>
  <rect x="54" y="270" width="18" height="26" rx="6" fill="none" stroke="#e8c840" stroke-width="2"/>
</svg>
