<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15101f"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c3ff"/>
      <stop offset="0.45" stop-color="#a87bff"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#a87bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a87bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <circle cx="512" cy="440" r="360" fill="url(#glow)"/>

  <!-- Faceted geode / gemstone -->
  <g transform="translate(512 530)">
    <!-- outer gem -->
    <path d="M0,-300 L220,-110 L150,260 L-150,260 L-220,-110 Z" fill="url(#crystal)"/>
    <!-- top crown facets -->
    <path d="M0,-300 L220,-110 L0,-40 Z" fill="#ffffff" opacity="0.30"/>
    <path d="M0,-300 L-220,-110 L0,-40 Z" fill="#ffffff" opacity="0.16"/>
    <path d="M-220,-110 L-150,260 L0,-40 Z" fill="#000000" opacity="0.12"/>
    <path d="M220,-110 L150,260 L0,-40 Z" fill="#000000" opacity="0.20"/>
    <!-- center facet line -->
    <path d="M0,-40 L0,260" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>
    <!-- sparkle -->
    <g transform="translate(120 -150)" fill="#ffffff">
      <path d="M0,-34 L9,-9 L34,0 L9,9 L0,34 L-9,9 L-34,0 L-9,-9 Z" opacity="0.9"/>
    </g>
  </g>
</svg>
